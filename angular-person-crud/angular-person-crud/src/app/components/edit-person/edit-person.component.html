<h2>Edit Person</h2>
<form (ngSubmit)="update()">
  <input [(ngModel)]="person.name" name="name" placeholder="Name" required><br>
  <input [(ngModel)]="person.age" name="age" placeholder="Age" required><br>
  <input [(ngModel)]="person.gender" name="gender" placeholder="Gender" required><br>
  <input [(ngModel)]="person.mobile" name="mobile" placeholder="Mobile" required><br>
  <button type="submit">Update</button>
</form>
