<h2>List of People</h2>
<table border="1">
  <tr><th>Name</th><th>Age</th><th>Gender</th><th>Mobile</th><th>Actions</th></tr>
  <tr *ngFor="let p of people">
    <td>{{ p.name }}</td>
    <td>{{ p.age }}</td>
    <td>{{ p.gender }}</td>
    <td>{{ p.mobile }}</td>
    <td>
      <button (click)="edit(p._id)">Edit</button>
      <button (click)="delete(p._id)">Delete</button>
    </td>
  </tr>
</table>
